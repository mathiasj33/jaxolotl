[project]
authors = [
    { name = "Mathias Jackermeier", email = "mathias.jackermeier@outlook.com" },
    { name = "Jacques Cloete", email = "jacques@robots.ox.ac.uk" },
]
name = "jaxolotl"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "LICENSES/Apache-2.0.txt",
    "THIRD_PARTY_NOTICES.md",
    "src/jaxolotl/environments/assets/franka_emika_panda/LICENSE",
]
dependencies = [
    "optax>=0.2.6,<0.3",
    "equinox>=0.13.2,<0.14",
    "distrax>=0.1.7,<0.2",
    "jax>=0.7.2,<0.8",
    "graphviz>=0.21,<0.22",
    "jraph<=0.0.6dev0",
    "mujoco-mjx>=3.11.0,<4",
    "wandb>=0.23.1,<0.24",
    "pyarrow>=22.0.0,<23",
    "scipy>=1.14,<2",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    "linux-64",
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12" },
]

[tool.pixi.pypi-dependencies]
jaxolotl = { path = ".", editable = true }

[tool.pixi.tasks]
copy-templates = "python -c \"import shutil; from pathlib import Path; [shutil.copy(f, f.with_suffix('')) for f in Path('conf').glob('*.template')]\""
install-pretrained-models = "python scripts/install_pretrained_models.py"
threejs = "bash -c '(sleep 1 && xdg-open http://localhost:8000) & python -m http.server 8000 --directory threejs_output'"
test = "pytest --ignore=runs -n 4 --dist loadfile -m 'not e2e'"
test-e2e = "pytest --ignore=runs --e2e -m e2e"

[tool.pixi.dependencies]
ruff = ">=0.16.3,<0.17"
python-dotenv = ">=1.1.0,<2"
jupyter = ">=1.1.1,<2"
pygame = ">=2.6.1,<3"
matplotlib = ">=3.10.6,<4"
hydra-core = ">=1.3.2,<2"
pandas = ">=2.3.3,<3"
seaborn = ">=0.13.2,<0.14"
pytest = ">=8.4.2,<9"
pytest-xdist = ">=3.8.0,<4"
joblib = ">=1.5.2,<2"
tqdm = ">=4.67.1,<5"
sympy = ">=1.14.0,<2"
spot = ">=2.14.4,<3"
tabulate = ">=0.10.0,<0.11"

[tool.pixi.feature.gpu]
platforms = ["linux-64-cuda"]

[tool.pixi.feature.gpu.pypi-dependencies]
jax = { version = "*", extras = ["cuda12"] }

[tool.pixi.environments]
default = { platforms = ["linux-64"] }
gpu = ["gpu"]

[tool.pytest.ini_options]
markers = ["e2e: end-to-end integration tests (requires --e2e)"]

[tool.ruff]
extend-exclude = ["semml"]

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "B018",    # Useless statement (used in notebooks)
    "D100",    # Missing docstring in public module
    "E402",    # Module level import not at top of file (used in notebooks)
    "E501",    # Line too long
    "E731",    # Do not assign a lambda expression, use a def
    "B008",    # Do not perform function calls in argument defaults
    "PLR2004", # Magic value (used in tests)
]
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # flake8-builtins
    "A",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-simplify
    "SIM",
    # flake8-unused-arguments
    "ARG",
    # pylint
    "PL",
    # tidy
    "TID",
    # isort,
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "D100",
    "UP",
]
[tool.ruff.lint.pylint]
max-args = 8
