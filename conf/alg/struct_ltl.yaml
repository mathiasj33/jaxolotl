name: struct_ltl

# The wrapping and agent are the same as in DeepLTL.
wrap_env:
  _target_: jaxolotl.alg.deep_ltl.wrappers.utils.wrap_env

agent:
  _target_: jaxolotl.alg.deep_ltl.eval.agent.DeepLTLAgent.instantiate
  vmap_choose_sequences: true

preprocess_formulas:
  _target_: jaxolotl.alg.struct_ltl.eval.preprocessing.preprocess_formulas

batcher:
  _target_: jaxolotl.alg.struct_ltl.batching.BooleanSequenceBatcher