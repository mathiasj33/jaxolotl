# @package __global__

defaults:
  - /rl_alg: ppo_safe

curriculum:
  make_stages:
    _target_: jaxolotl.alg.genz_ltl.curriculum.generic_curriculum.make_stages
  num_samples: 1e4
  window: 512
  adopt_prob: 0.1
  min_coverage: 0.9

model:
  _target_: jaxolotl.alg.genz_ltl.model.model.GenZLTLModel
  _recursive_: false
  observation_reduction_fn:
    _target_: jaxolotl.alg.genz_ltl.model.observation_reduction.FrankaZoneEnvObservationReduction
  env_net:
    _target_: jaxolotl.networks.observation_encoder.FlattenMLPEncoder
    hidden_sizes: [128]
    out_size: 64
    activation: ${act:tanh}
  actor:
    _target_: jaxolotl.rl.actor.continuous_actor.ContinuousActor
    hidden_sizes: [128, 128]
    hidden_activation: ${act:relu}
    output_activation: ${act:tanh}
    state_dependent_std: true
    use_epsilon: false
  critic:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [128, 128]
    activation: ${act:softplus}
    final_layer_activation: true
  cost_critic:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [128, 128]
    activation: ${act:tanh}
    final_layer_activation: false
  lagrangian:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [128, 128]
    activation: ${act:softplus}
    final_layer_activation: true

rl_alg:
  total_timesteps: 2e8
  num_envs: 2048
  num_steps: 64
  num_minibatches: 4
  update_epochs: 5
  gamma: 0.995
  cost_gamma: 0.995
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.003
  vf_coef: 1.0
  cost_vf_coef: 1.0
  lag_coef: 1.0
  lr: 5e-4
  max_grad_norm: 1.0
  anneal_lr: false
  adam_eps: 1e-8
  target_cost: -0.05
  min_lag: 1e-2
  max_lag: 5.0
