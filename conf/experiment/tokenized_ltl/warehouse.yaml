# @package __global__

defaults:
  - /experiment/struct_ltl/warehouse
  - override /alg: tokenized_ltl
  - _self_

model:
  _target_: jaxolotl.alg.struct_ltl.model.tokenized_ltl.TokenizedLTLModel
  sequence:
    # Token embedding dimension (same as struct_ltl embedding_dim for fair comparison)
    embedding_dim: 16
    # Hidden size for the token-level GRU that processes tokens within a step
    # Produces reach and avoid embeddings of this size; concatenated = 2*token_hidden_size
    token_hidden_size: 16

