# @package __global__

defaults:
  - /rl_alg: ppo

curriculum:
  make_stages:
    _target_: jaxolotl.alg.deep_ltl.curriculum.zone_env_curriculum.make_stages
  num_samples: 1e4
  window: 256
  adopt_prob: 0.1
  min_coverage: 0.9

model:
  _target_: jaxolotl.alg.deep_ltl.model.model.DeepLTLModel
  _recursive_: false
  env_net:
    _target_: jaxolotl.networks.observation_encoder.FlattenMLPEncoder
    hidden_sizes: [128]
    out_size: 64
    activation: ${act:tanh}
  actor:
    _target_: jaxolotl.rl.actor.continuous_actor.ContinuousActor
    hidden_sizes: [64, 64, 64]
    hidden_activation: ${act:relu}
    output_activation: ${act:tanh}
    state_dependent_std: true
    use_epsilon: true
  critic:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: ${act:tanh}
  sequence:
    embedding_dim: 16
    deep_sets:
      _target_: jaxolotl.networks.deep_sets.DeepSets
      hidden_sizes: [32]
      out_size: 16
      activation: ${act:relu}

rl_alg:
  total_timesteps: 20e6
  num_envs: 16
  num_steps: 4096
  num_minibatches: 32
  update_epochs: 10
  gamma: 0.998
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.003
  vf_coef: 0.5
  lr: 3e-4
  max_grad_norm: 0.5
  anneal_lr: false
  adam_eps: 1e-8

save_freq: 5e5