# @package __global__

defaults:
  - /rl_alg: ppo_safe

curriculum:
  make_stages:
    _target_: jaxolotl.alg.genz_ltl.curriculum.generic_curriculum.make_stages
  num_samples: 1e5
  window: 256
  adopt_prob: 0.1
  min_coverage: 0.9

model:
  _target_: jaxolotl.alg.genz_ltl.model.model.GenZLTLModel
  _recursive_: false
  observation_reduction_fn:
    _target_: jaxolotl.alg.genz_ltl.model.observation_reduction.GenericObservationReduction
  env_net:
    _target_: jaxolotl.networks.observation_encoder.FlattenMLPEncoder
    hidden_sizes: [128]
    out_size: 64
    activation: ${act:tanh}
  actor:
    _target_: jaxolotl.rl.actor.composite_actor.CompositeActor
    hidden_sizes: [64, 64, 64]
    hidden_activation: ${act:relu}
    output_activation: ${act:tanh}
    state_dependent_std: true
    use_epsilon: false
  critic:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: ${act:softplus}
  cost_critic:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: ${act:tanh}
  lagrangian:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: ${act:softplus}

rl_alg:
  total_timesteps: 2e8
  num_envs: 128
  num_steps: 1024
  num_minibatches: 4
  update_epochs: 5
  gamma: 0.998
  cost_gamma: 0.998
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.003
  vf_coef: 1.0
  cost_vf_coef: 1.0
  lag_coef: 1.0
  lr: 5e-4
  max_grad_norm: 1.0
  anneal_lr: false
  adam_eps: 1e-8
  target_cost: -0.1
  min_lag: 1e-3
  max_lag: 3.0
