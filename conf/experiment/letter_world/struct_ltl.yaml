# @package __global__

defaults:
  - /rl_alg: ppo
  - /model/sequence: alibi_attention
  - _self_

curriculum:
  make_stages:
    _target_: jaxolotl.alg.struct_ltl.curriculum.letter_world_curriculum.make_stages
  num_samples: 1e4
  window: 256
  adopt_prob: 0.1
  min_coverage: 0.9

model:
  _target_: jaxolotl.alg.struct_ltl.model.model.StructLTLModel
  _recursive_: false
  env_net:
    _target_: jaxolotl.networks.observation_encoder.FieldConvEncoder
    field: grid
    channels: [16, 32, 64]
    kernel_size: [2, 2]
    activation: ${act:relu}
  actor:
    _target_: jaxolotl.rl.actor.discrete_actor.DiscreteActor
    hidden_sizes: [64, 64, 64]
    activation: ${act:relu}
    use_epsilon: true
  critic:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: ${act:tanh}
  sequence:
    embedding_dim: 32
    clause_mlp:
      _target_: jaxolotl.networks.deep_sets.DeepSets
      hidden_sizes: []
      out_size: 32
      activation: ${act:relu}
    disjunct_mlp:
      _target_: jaxolotl.networks.deep_sets.DeepSets
      hidden_sizes: []
      out_size: 32
      activation: ${act:relu}

rl_alg:
  total_timesteps: 20e6
  num_envs: 16
  num_steps: 128
  num_minibatches: 8
  update_epochs: 8
  gamma: 0.94
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  lr: 3e-4
  max_grad_norm: 0.5
  anneal_lr: false
  adam_eps: 1e-8

save_freq: 5e5