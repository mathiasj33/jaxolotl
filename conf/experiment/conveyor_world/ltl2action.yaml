# @package __global__

defaults:
  - /rl_alg: ppo

curriculum:
  make_stages:
    _target_: jaxolotl.alg.sem_ltl.curriculum.conveyor_world_curriculum.make_stages
  num_samples: 1e4
  window: 256
  adopt_prob: 0.1
  min_coverage: 0.9

model:
  _target_: jaxolotl.alg.ltl2action.model.model.LTL2ActionModel
  _recursive_: false
  env_net:
    _target_: jaxolotl.networks.observation_encoder.FlattenMLPEncoder
    hidden_sizes: []
    out_size: 4
    activation: ${act:tanh}
  actor:
    _target_: jaxolotl.rl.actor.discrete_actor.DiscreteActor
    hidden_sizes: [64]
    activation: ${act:relu}
    use_epsilon: false
  critic:
    _target_: jaxolotl.networks.mlp.MLP
    hidden_sizes: [64]
    activation: ${act:tanh}
  rgcn:
    _target_: jaxolotl.networks.rgcn.RGCN
    embedding_dim: 32
    # rgcn.num_layers must be set per-variant: message passing is child->parent only,
    # so the root sees depth <= num_layers, and the chain-discriminating final
    # proposition sits at depth 2k-1. Variants use 2k+1.
    activation: ${act:tanh}

rl_alg:
  total_timesteps: 2e6
  num_envs: 256
  num_steps: 64
  num_minibatches: 4
  update_epochs: 8
  gamma: 0.9
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  lr: 3e-4
  max_grad_norm: 0.5
  anneal_lr: false
  adam_eps: 1e-8

save_freq: 1e5
