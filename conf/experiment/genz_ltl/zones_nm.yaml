# @package __global__

defaults:
  - /env: zone_env_nm
  - /alg: genz_ltl
  - /rl_alg: ppo_safe

curriculum:
  _target_: jaxltl.genz_ltl.curriculum.zone_env_curriculum.make

curriculum_wrapper:
  episode_window: 256

model:
  _target_: jaxltl.genz_ltl.model.genz_ltl.GenZLTLModel
  _recursive_: false
  observation_reduction_fn:
    _target_: jaxltl.genz_ltl.model.observation_reduction.ZoneEnvObservationReduction
    # _target_: jaxltl.genz_ltl.model.observation_reduction.GenericObservationReduction
    # output_size: 78
  env_net:
    _target_: jaxltl.networks.mlp.MLP
    hidden_sizes: [128]
    out_size: 64
    activation: ${act:tanh}
  actor:
    _target_: jaxltl.rl.actor.continuous_actor.ContinuousActor
    hidden_sizes: [64, 64, 64]
    hidden_activation: ${act:relu}
    output_activation: ${act:tanh}
    state_dependent_std: true
    use_epsilon: false
  critic:
    _target_: jaxltl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: ${act:softplus}
  cost_critic:
    _target_: jaxltl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: ${act:tanh}
  lagrangian:
    _target_: jaxltl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: ${act:softplus}

rl_alg:
  total_timesteps: 20e6
  num_envs: 16
  num_steps: 4096
  num_minibatches: 32
  update_epochs: 10
  gamma: 0.998
  cost_gamma: 0.998
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.003
  vf_coef: 1.0
  cost_vf_coef: 1.0
  lag_coef: 1.0
  lr: 3e-4
  max_grad_norm: 0.5
  anneal_lr: false
  adam_eps: 1e-8
  target_cost: -0.05
  min_lag: 1e-2
  max_lag: 5.0
