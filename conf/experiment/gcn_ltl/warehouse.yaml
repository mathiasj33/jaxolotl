# @package __global__

defaults:
  - /experiment/struct_ltl/warehouse
  - override /alg: gcn_ltl
  - _self_

model:
  _target_: jaxolotl.alg.struct_ltl.model.gcn_model.GCNLTLModel
  sequence:
    embedding_dim: 16
    gcn:
      _target_: jaxolotl.networks.gcn.GCN
      hidden_sizes: [16, 16]
      out_size: 16
      activation: ${act:relu}
      residual: false
